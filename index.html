<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mindblow</title>
<meta name="description" content="mindblow: Wie funktioniert die Welt? Körper, Natur, Technik, Weltall und Geld, zum Ausprobieren.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..700,0..100,0..1&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="index.html">mind<b>blow</b><i></i></a>
    <nav></nav>
  </header>
</div>

<main class="wrap">
  <section class="hero">
    <h1 class="wordmark" aria-label="mindblow"><span class="w-sans">mind</span><span class="w-serif">blow</span><span class="dot"></span></h1>

    <div class="note" aria-hidden="true">
      <span class="hand" id="topicCount">23 Themen,<br>es werden mehr</span>
      <svg viewBox="0 0 92 60" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
        <path d="M4 6 C 20 40, 52 52, 84 40"/>
        <path d="M74 33 L 85 40 L 73 47"/>
      </svg>
    </div>

    <p class="lead">Wie funktioniert die Welt eigentlich? Dein Körper, die Natur, die Technik, das Weltall und das Geld.</p>

    <button type="button" class="hero-search glass" id="heroSearch"><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4.5 4.5"/></svg><span>Was willst du verstehen?</span><kbd>/</kbd></button>

    <div class="stamp" aria-hidden="true">
      <svg viewBox="0 0 120 120">
        <defs><path id="circ" d="M60,60 m-46,0 a46,46 0 1,1 92,0 a46,46 0 1,1 -92,0"/></defs>
        <text><textPath href="#circ">wie die welt funktioniert · </textPath></text>
      </svg>
    </div>
  </section>

  <div id="catalog"></div>
</main>

<div class="wrap">
  <footer>
    <span>mindblow — wie die Welt funktioniert</span>
    <span>Neue Themen folgen laufend</span>
  </footer>
</div>

<script src="js/themen.js"></script>
<script src="js/common.js"></script>
<script>
(() => {
  const { $, BEREICHE, TOPICS, liveIn, topicsIn, progressOf, card, esc, urlB, urlG, openSearch } = MB;
  $('#topicCount').innerHTML = `${TOPICS.length} Themen,<br>es werden mehr`;
  $('#heroSearch').addEventListener('click', () => openSearch());

  const shelf = (title, link, items) => `<section class="shelf">
      <div class="shelf-head"><h2>${title}</h2>${link || ''}</div>
      <div class="scroller">${items.map(t => card(t)).join('')}</div>
    </section>`;

  // Weitermachen: angefangene Themen zuerst
  const started = TOPICS.filter(t => { const n = progressOf(t.slug); return n > 0 && n < 4; });
  // Neu: zuletzt hinzugefügt
  const neu = [...TOPICS].sort((a, b) => (b.added || '').localeCompare(a.added || '') || a.i - b.i).slice(0, 8);

  $('#catalog').innerHTML =
    (started.length ? shelf('Weitermachen', '', started) : '') +
    `<section class="shelf" id="bereiche">
      <div class="shelf-head"><h2>Bereiche</h2><a href="themen.html">Alle Themen von A bis Z →</a></div>
      <div class="bgrid">
        ${BEREICHE.map(b => {
          const live = liveIn(b.id), done = live.filter(t => progressOf(t.slug) >= 4).length, soon = topicsIn(b.id).length - live.length;
          return `<div class="bcard glass">
            <h3><a href="${urlB(b.id)}">${esc(b.name)}</a></h3>
            <p>${esc(b.intro)}</p>
            <div class="glist">${b.gebiete.map(g => {
              const n = liveIn(b.id, g.id).length;
              return `<a class="${n ? '' : 'empty'}" href="${urlG(b.id, g.id)}">${esc(g.name)}</a>`;
            }).join('')}</div>
            <div class="bmeta"><span>${live.length} Themen${soon ? ` · ${soon} in Arbeit` : ''}</span><span>${done ? `${done} erledigt` : ''}</span></div>
          </div>`;
        }).join('')}
      </div>
    </section>` +
    shelf('Neu dazugekommen', '<a href="themen.html">Alle ansehen →</a>', neu);
})();
</script>
</body>
</html>
