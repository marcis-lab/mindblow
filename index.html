<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mindblow</title>
<meta name="description" content="mindblow: Wie funktioniert die Welt? Strom, Internet, KI, das Universum und dein Gehirn, zum Ausprobieren.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..700,0..100,0..1&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="index.html">mind<b>blow</b><i></i></a>
    <nav></nav>
  </header>
</div>

<main class="wrap">
  <section class="hero">
    <h1 class="wordmark" aria-label="mindblow"><span class="w-sans">mind</span><span class="w-serif">blow</span><span class="dot"></span></h1>

    <div class="note" aria-hidden="true">
      <span class="hand" id="topicCount">13 Themen,<br>es werden mehr</span>
      <svg viewBox="0 0 92 60" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
        <path d="M4 6 C 20 40, 52 52, 84 40"/>
        <path d="M74 33 L 85 40 L 73 47"/>
      </svg>
    </div>

    <p class="lead">Wie funktioniert die Welt eigentlich? Strom, Internet, KI, das Universum und dein eigenes Gehirn.</p>

    <div class="stamp" aria-hidden="true">
      <svg viewBox="0 0 120 120">
        <defs><path id="circ" d="M60,60 m-46,0 a46,46 0 1,1 92,0 a46,46 0 1,1 -92,0"/></defs>
        <text><textPath href="#circ">wie die welt funktioniert · </textPath></text>
      </svg>
    </div>
  </section>

  <div id="catalog"></div>
</main>

<div class="wrap">
  <footer>
    <span>mindblow — wie die Welt funktioniert</span>
    <span>Neue Themen folgen laufend</span>
  </footer>
</div>

<script src="js/common.js"></script>
<script>
(() => {
  const { $, CATS, TOPICS, progressOf } = MB;
  $('#topicCount').innerHTML = `${TOPICS.length} Themen,<br>es werden mehr`;
  $('#catalog').innerHTML = CATS.map(c => {
    const list = TOPICS.filter(t => t.cat === c.id);
    return `<section class="cat" id="${c.id}">
      <div class="cat-head"><h2>${c.name}</h2><span class="eyebrow">${list.length} ${list.length === 1 ? 'Thema' : 'Themen'}</span></div>
      <div class="cards">
        ${list.map(t => {
          const n = progressOf(t.slug);
          const state = n >= 4 ? 'Abgeschlossen' : n > 0 ? `${n} von 4 gelöst` : '4 Aufgaben · 15 Min.';
          return `<a class="topic${n >= 4 ? ' done' : ''}" href="${t.slug}.html" data-tilt>
            <span class="num"><small>Nº</small>${t.nr}</span>
            <span class="chip">${n >= 4 ? 'Erledigt' : n > 0 ? 'Angefangen' : 'Offen'}</span>
            <h3>${t.title}</h3>
            <p>${t.teaser}</p>
            <div class="meta"><span>${state}</span><span class="go">Starten</span></div>
          </a>`;
        }).join('')}
      </div>
    </section>`;
  }).join('');
})();
</script>
</body>
</html>
